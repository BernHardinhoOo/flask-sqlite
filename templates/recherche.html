<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recherche</title>
</head>
<body>
    <p><a href="/">Accueil</a></p>
    <h1>Rechercher un client</h1>
    <form action="/recherche" method="get">
        <input type="text" name="q" value="{{ q }}" placeholder="Nom ou prénom...">
        <select name="tri">
            <option value="nom" {% if tri == 'nom' %}selected{% endif %}>Trier par nom</option>
            <option value="prenom" {% if tri == 'prenom' %}selected{% endif %}>Trier par prénom</option>
            <option value="created" {% if tri == 'created' %}selected{% endif %}>Trier par date de création</option>
        </select>
        <button type="submit">Rechercher</button>
    </form>

    {% if q %}
        <p>{{ data|length }} résultat(s) pour « {{ q }} »</p>
        <ul>
        {% for row in data %}
            <li><a href="/fiche_client/{{ row['id'] }}">{{ row['nom'] }} {{ row['prenom'] }}</a></li>
        {% endfor %}
        </ul>
    {% endif %}
</body>
</html>
